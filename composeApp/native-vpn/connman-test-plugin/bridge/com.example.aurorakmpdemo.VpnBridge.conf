<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Владеть сервисом может только root; обычные callers могут отправлять
       запросы, но не способны выдать себя за bridge. Исполняемый файл сам
       предоставляет фиксированный, не произвольный набор методов. -->
  <policy user="root">
    <allow own="com.example.aurorakmpdemo.VpnBridge"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.example.aurorakmpdemo.VpnBridge"/>
  </policy>
</busconfig>
