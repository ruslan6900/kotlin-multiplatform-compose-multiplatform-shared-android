[DACPrivileges]
# ConnMan запускает этот provider. Привилегии нужны только для подключения к уже
# созданному TUN-интерфейсу; маршруты и DNS остаются фиксированными в plugin.
# Provider получает лишь capabilities, необходимые для открытия TUN, и никогда
# не получает настройку default route или DNS.
User = defaultuser
Group = vpn
SupplementaryGroups = inet, net_admin, privileged
